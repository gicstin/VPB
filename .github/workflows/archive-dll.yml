name: Auto-Archive DLL

on:
  push:
    paths:
      - "vam_patch/BepInEx/plugins/VPB.dll"

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Debug token presence
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "ERROR: PAT_TOKEN secret is empty or not set!"
          else
            echo "PAT_TOKEN secret is set (length: ${#PAT_TOKEN})"
          fi
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # IMPORTANT: allows accessing previous commit
          token: ${{ secrets.PAT_TOKEN }}

      - name: Create archive folder if missing
        run: mkdir -p archive

      - name: Generate timestamp
        id: ts
        run: echo "stamp=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Restore previous version of DLL
        run: |
          # Check if the file existed in the previous commit
          if git show HEAD~1:vam_patch/BepInEx/plugins/VPB.dll > /dev/null 2>&1; then
            mkdir -p archive/${{ steps.ts.outputs.stamp }}
            git show HEAD~1:vam_patch/BepInEx/plugins/VPB.dll > archive/${{ steps.ts.outputs.stamp }}/VPB.dll
            echo "Archived previous DLL version."
          else
            echo "No previous DLL found to archive."
          fi

      - name: Commit archive changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add archive
          git commit -m "Archived VPB.dll at ${{ steps.ts.outputs.stamp }}" || echo "No changes to commit"

      - name: Debug git auth state before push
        run: |
          echo "=== Remote URL ==="
          git remote -v
          echo "=== Git credential config ==="
          git config --list | grep -i 'url\|credential\|token' || echo "No credential config found"
          echo "=== Whoami via API ==="
          curl -sf -H "Authorization: token ${{ secrets.PAT_TOKEN }}" https://api.github.com/user | python3 -c "import sys,json; d=json.load(sys.stdin); print('Authenticated as:', d.get('login','unknown'))" || echo "API call failed - token may be invalid or missing"

      - name: Push changes
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/gicstin/VPB.git
          git push
