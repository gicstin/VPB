# VPB benchmark / validation config
# Copy this file next to VPB.dll as: bench_run.cfg
# Uncomment "enabled = true" to arm the runner.
#
# Config lives in: BepInEx/plugins/bench_run.cfg
# Results live in: BepInEx/plugins/bench/  (override subfolder via outputDir)

# enabled = true
enabled = false

# baseline — save run as baseline under BepInEx/plugins/bench/baselines/<baselineId>/
# compare — diff run against an existing baseline (requires baselineId)
mode = baseline
baselineId = my_baseline

# hotkey — press hotkey after VaM is ready
# auto   — run after autoDelaySeconds once FileManager is ready
# manual — same as hotkey (no auto start)
trigger = hotkey
hotkey = Ctrl+F10
# autoDelaySeconds = 15

trackStartup = true
trackSceneLoad = true

maxCandidates = 4
selectedCandidates = stock, minimal

clearTextureCache = false
clearAbCache = false
waitBetweenScenesSeconds = 5
captureSceneScreenshots = true
reloadSceneBetweenRuns = true
# outputDir = bench

[candidate.stock]
label = Stock whitelist (no package override)
# packageUids =

[candidate.minimal]
label = Minimal explicit package UIDs
# packageUids = Creator.Package.1, Other.Package.2

[scenes]
# REQUIRED: at least one uncommented scene line or the runner will not arm.
# scene = Saves/scene/MyBenchmark.json
# scene = Creator.Scene.1:/Saves/scene/MyScene.json

[settings]
# Optional session-only VPB setting overrides (field names from Settings.cs):
# ScenePrewarmEnabled = true
# MinTextureSize = 1024
# MaxTextureSize = 4096
